name: CI

on:
  push:
    branches: [dev, "module/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: clang-format check
        run: |
          sudo apt-get install -y clang-format
          find main modules -name "*.cpp" -o -name "*.h" | \
            xargs clang-format --dry-run --Werror --style=file 2>&1 | head -50

      - name: Python black check
        run: |
          pip install black
          black --check tools/

      - name: Validate module manifests
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          REQUIRED = ["id","name","version","author","category",
                      "requires_hardware","min_os_version","entrypoint"]
          errors = []
          for m in pathlib.Path("modules").iterdir():
              mf = m / "manifest.json"
              if not mf.exists():
                  errors.append(f"{m.name}: missing manifest.json")
                  continue
              try:
                  d = json.loads(mf.read_text())
                  missing = [k for k in REQUIRED if k not in d]
                  if missing:
                      errors.append(f"{m.name}: manifest missing {missing}")
              except json.JSONDecodeError as e:
                  errors.append(f"{m.name}: invalid JSON: {e}")
          if errors:
              print("Manifest errors:")
              for e in errors: print(f"  {e}")
              sys.exit(1)
          print(f"All {len(list(pathlib.Path('modules').iterdir()))} manifests valid.")
          EOF

  build:
    name: Build base OS
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32s3
          path: "."
          command: idf.py build

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: m5-ctOS-firmware-${{ github.sha }}
          path: |
            build/m5-ctOS.bin
            build/partition-table.bin
            build/bootloader/bootloader.bin
          retention-days: 14
