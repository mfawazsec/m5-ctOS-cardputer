<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m5-ctOS</title>
<style>
  body { font-family: monospace; background: #0d1117; color: #c9d1d9; margin: 0; padding: 16px; }
  h1   { color: #58a6ff; }
  h2   { color: #79c0ff; border-bottom: 1px solid #30363d; padding-bottom: 4px; }
  a    { color: #58a6ff; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px;
          padding: 12px; margin: 12px 0; }
  .stat { display: flex; justify-content: space-between; padding: 4px 0; }
  .label { color: #8b949e; }
  .value { color: #3fb950; font-weight: bold; }
  .running { color: #3fb950; }
  .idle    { color: #8b949e; }
  nav a { margin-right: 16px; padding: 6px 12px; border: 1px solid #30363d;
          border-radius: 4px; text-decoration: none; }
  nav a:hover { background: #21262d; }
</style>
</head>
<body>
<h1>m5-ctOS v2.0</h1>
<nav>
  <a href="/">Dashboard</a>
  <a href="/modules">Modules</a>
  <a href="/files">Files</a>
  <a href="/settings">Settings</a>
</nav>

<div class="card" id="stats">
  <h2>System</h2>
  <div class="stat"><span class="label">Free heap</span><span class="value" id="heap">…</span></div>
  <div class="stat"><span class="label">PSRAM free</span><span class="value" id="psram">…</span></div>
  <div class="stat"><span class="label">Loaded modules</span><span class="value" id="mods">…</span></div>
  <div class="stat"><span class="label">WiFi mode</span><span class="value" id="wifi">AP</span></div>
</div>

<div class="card" id="module-list">
  <h2>Active Modules</h2>
  <div id="mod-rows">Loading…</div>
</div>

<script src="pin_auth.js"></script>
<script>
async function refresh() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    document.getElementById('heap').textContent  = d.free_heap_kb  + ' KB';
    document.getElementById('psram').textContent = d.free_psram_mb + ' MB';
    document.getElementById('mods').textContent  = d.module_count;
    document.getElementById('wifi').textContent  = d.wifi_up ? 'AP ✓' : 'OFF';

    const rows = d.modules.map(m =>
      `<div class="stat">
        <span class="${m.running ? 'running' : 'idle'}">[${m.running ? '*' : ' '}] ${m.id}</span>
        <span class="label">${m.name} v${m.version}</span>
        <span class="${m.running ? 'running' : 'idle'}">${m.running ? 'RUNNING' : 'IDLE'}</span>
       </div>`
    ).join('');
    document.getElementById('mod-rows').innerHTML = rows || '<span class="label">No modules loaded.</span>';
  } catch (e) {
    document.getElementById('mod-rows').textContent = 'Error fetching status.';
  }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
